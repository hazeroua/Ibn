name: CI

# Validation du jeu (Projet/) par sa commande unique, Projet/outils/valider.ps1, sous Windows et
# sous Linux. Les machines de GitHub n'ont pas de carte graphique : Windows s'arrête avant
# l'export et la mesure ; Linux mesure avec le rendu logiciel (OpenGL sur llvmpipe), budgets
# affichés sans bloquer. Les chiffres de performance n'ont de valeur que sur la machine cible
# (Windows, Intel Arc). Détails : Docs/validation-multi-os.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Blender utilisé par la CI pour préparer le personnage (sur les postes, c'est celui de
  # l'installateur du système, noté dans Tools/outils.json).
  BLENDER_SERIE: "5.0"
  BLENDER_VERSION: "5.0.1"

jobs:
  windows:
    name: Windows (Windows PowerShell 5.1, sans export ni mesure)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache des téléchargements
        uses: actions/cache@v4
        with:
          path: |
            Tools/_telechargements
            Tools/blender
            Projet/ressources/telechargees
          key: windows-${{ hashFiles('Tools/versions.json', 'Projet/data/ressources.lock.json') }}-blender-${{ env.BLENDER_VERSION }}-v2

      - name: Dépendances (Godot, gdtoolkit)
        shell: powershell
        run: .\Tools\dependances.ps1 -SansModelesExport

      - name: Blender portable
        shell: pwsh
        run: |
          $Dossier = "Tools/blender/blender-$env:BLENDER_VERSION-windows-x64"
          if (-not (Test-Path "$Dossier/blender.exe")) {
            New-Item -ItemType Directory -Force -Path Tools/blender | Out-Null
            Invoke-WebRequest "https://download.blender.org/release/Blender$env:BLENDER_SERIE/blender-$env:BLENDER_VERSION-windows-x64.zip" -OutFile Tools/blender/blender.zip
            Expand-Archive Tools/blender/blender.zip -DestinationPath Tools/blender -Force
            Remove-Item Tools/blender/blender.zip
          }
          $Outils = Get-Content -Raw Tools/outils.json | ConvertFrom-Json
          $Chemin = (Resolve-Path "$Dossier/blender.exe").Path
          $Outils | Add-Member -NotePropertyName blender -NotePropertyValue ([ordered]@{ chemin = $Chemin; version = "Blender $env:BLENDER_VERSION" }) -Force
          $Outils | ConvertTo-Json -Depth 6 | Set-Content -Encoding UTF8 Tools/outils.json

      - name: Validation (comme valider.bat, sans export ni mesure)
        shell: powershell
        run: .\Projet\outils\valider.ps1 -SansExport

      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-windows
          path: Projet/rapports/
          if-no-files-found: ignore

  linux:
    name: Linux (rendu logiciel, mesure sans budgets bloquants)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache des téléchargements
        uses: actions/cache@v4
        with:
          path: |
            Tools/_telechargements
            Tools/blender
            Projet/ressources/telechargees
          key: linux-${{ hashFiles('Tools/versions.json', 'Projet/data/ressources.lock.json') }}-blender-${{ env.BLENDER_VERSION }}-v2

      - name: Rendu logiciel et affichage virtuel
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libgl1-mesa-dri libvulkan1 xvfb python3-venv xz-utils libxi6 libxkbcommon0 libsm6

      - name: Dépendances (Godot, gdtoolkit)
        shell: pwsh
        run: ./Tools/dependances.ps1 -SansModelesExport

      - name: Blender portable
        run: |
          if [ ! -x Tools/blender/blender ]; then
            mkdir -p Tools/blender
            curl -sSfL "https://download.blender.org/release/Blender${BLENDER_SERIE}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" | tar xJ -C Tools/blender --strip-components=1
          fi
          Tools/blender/blender --background --factory-startup --version | head -1

      - name: Validation complète avec rendu logiciel
        run: >
          xvfb-run -a -s "-screen 0 1920x1080x24"
          pwsh -NoProfile -File ./Projet/outils/valider.ps1
          -Renderer opengl3 -SansSon -DurationSeconds 10 -WarmupSeconds 1

      - name: Rapports, captures et mesures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-linux
          path: Projet/rapports/
          if-no-files-found: ignore
